name: HUGO daily digest
on:
  schedule: [{ cron: '0 6 * * *' }]
  workflow_dispatch:
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm run digest > digest.txt
      - uses: actions/upload-artifact@v4
        with: { name: daily-digest, path: digest.txt }
