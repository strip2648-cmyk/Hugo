name: HUGO auto-learn
on:
  schedule: [{ cron: '0 */6 * * *' }]
  workflow_dispatch:
jobs:
  learn:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm run autolearn -- 20
      - run: "git config user.email hugo@users.noreply.github.com && git config user.name 'Hugo Bot' && git add memory || true && git commit -m 'auto-learned knowledge' || echo none && git push || echo push-skipped"
